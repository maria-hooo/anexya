services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rfid
      MYSQL_USER: rfid
      MYSQL_PASSWORD: rfid_local_pw
      MYSQL_ROOT_PASSWORD: root_local_pw
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/rfid?sslMode=PREFERRED&allowPublicKeyRetrieval=true
      DB_USERNAME: rfid
      DB_PASSWORD: rfid_local_pw
    ports:
      - "8080:8080"