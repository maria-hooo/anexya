spring:
  application:
    name: rfid-service
  datasource:
    url: jdbc:h2:mem:rfiddb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

rfid:
  kinesis:
    enabled: false
    stream-name: rfid-reads

logging:
  level:
    com.anexya.rfid_service: INFO

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

rfid:
  kinesis:
    enabled: ${KINESIS_ENABLED:false}
    stream-name: ${KINESIS_STREAM_NAME:rfid-reads}

logging:
  structured:
    format:
      console: ecs
